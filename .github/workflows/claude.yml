name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Necesario para que Claude lea resultados de CI en los PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Camino B: token atado a tu suscripción Pro/Max/Team/Enterprise
          # (generado localmente con `claude setup-token`)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Si en algún momento prefieres facturación por API en vez de suscripción,
          # comenta la línea de arriba y descomenta esta:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Opcional: invocar tu skill de clasificación de riesgo directamente
          # prompt: "/skill-nombre-de-tu-skill-de-riesgo"

          # Opcional: cambiar la frase disparadora (default: @claude)
          # trigger_phrase: "/claude"

          # Opcional: disparar cuando se asigna un issue a un usuario específico
          # assignee_trigger: "claude-bot"

          # Opcional: argumentos CLI adicionales
          # claude_args: |
          #   --model claude-sonnet-5
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Sigue nuestros estándares de código. Asegura que el código nuevo tenga tests."
